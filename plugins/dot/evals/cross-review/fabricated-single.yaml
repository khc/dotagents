id: fabricated-single
skill: dot:cross-review
tier: behavioral

purpose: >
  Verify protocol step 5: a single-source finding whose cited evidence does not exist is dropped and recorded in cross_review.dropped_findings.

fixture: ../../evals/cross-review/files/fabricated-single/

prompt: >
  Scope is already active on plugins/dot/evals/cross-review/files/fabricated-single/. The review-fanout step is already complete: plugins/dot/evals/cross-review/files/fabricated-single/fanout.json lists the reviewers, and each reviewer's saved sidecar context is the file under plugins/dot/evals/cross-review/files/fabricated-single/reviewers/ (read those files instead of calling sidecar_workflow.py; do not run review-fanout again). Run the rest of cross-review (normalize, merge, verify, final review) and print the consolidated sidecar payload JSON instead of saving it. Three reviewers saved reviews of src/users.ts; only agy reported a finding.

expected:
  trigger: true
  behavior:
    - "The agent verifies agy's finding against src/users.ts before including it"
    - "The final review contains no SQL injection finding"
    - "cross_review.dropped_findings contains an entry with reviewer agy and a reason"
    - "The verdict is ready because the merged findings are empty"

forbidden:
  - "including agy's SQL injection finding in the final review"
  - "marking the verdict not-ready because of the dropped finding"

red:
  status: not_applicable
  evidence: []
  rationalizations: []
  note: >
    A baseline cannot be run: the case prompt invokes the cross-review protocol, which does not
    exist without the skill. Only the with-skill run is recorded.

green:
  status: pass
  evidence:
    - "Reasoning: \"`src/users.ts` has 3 lines, so line 40 does not exist ... parameterized\". Final findings empty, verdict ready, cross_review.dropped_findings = [{reviewer: agy, location: src/users.ts:40, reason: ...}]."
  note: >
    One run from /Users/khc/.agents (repo root) via `claude -p --plugin-dir /Users/khc/.agents/plugins/dot
    --allowedTools "Read Glob Grep Skill" --max-turns 40 --output-format json "<prompt>"`, graded against
    `expected.behavior` and `forbidden` by the same session that wrote the skill (not an independent
    grader). Single run; no repeat variance measured. No SKILL.md change needed.
    The agent tried Bash twice and was denied (Bash is not in the allowed tools); it fell back to Read/Glob.

metrics:
  red:
    total_tokens:
    duration_ms:
  green:
    total_tokens: 288708  # 12 turns, $0.20
    duration_ms: 20845

regression:
  keep: true
