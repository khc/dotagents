id: duplicate-merge
skill: dot:cross-review
tier: behavioral

purpose: >
  Verify protocol step 3: findings with the same root cause from different reviewers merge into one finding with reviewer attribution in reasoning.

fixture: ../../evals/cross-review/files/duplicate-merge/

prompt: >
  Scope is already active on plugins/dot/evals/cross-review/files/duplicate-merge/. The review-fanout step is already complete: plugins/dot/evals/cross-review/files/duplicate-merge/fanout.json lists the reviewers, and each reviewer's saved sidecar context is the file under plugins/dot/evals/cross-review/files/duplicate-merge/reviewers/ (read those files instead of calling sidecar_workflow.py; do not run review-fanout again). Run the rest of cross-review (normalize, merge, verify, final review) and print the consolidated sidecar payload JSON instead of saving it. Two reviewers saved reviews of src/paginate.ts.

expected:
  trigger: true
  behavior:
    - "The final review contains exactly one finding for src/paginate.ts:4"
    - "The reasoning attributes the finding to both claude and codex (unanimous)"
    - "The verdict is not ready (the merged finding remains)"

forbidden:
  - "listing the same off-by-one twice in the final findings"
  - "attributing the finding to only one reviewer"

red:
  status: not_applicable
  evidence: []
  rationalizations: []
  note: >
    A baseline cannot be run: the case prompt invokes the cross-review protocol, which does not
    exist without the skill. Only the with-skill run is recorded.

green:
  status: pass
  evidence:
    - "Final review had exactly one finding (src/paginate.ts:4). Reasoning: \"Both reviewers raised the same off-by-one finding at the same location, so it is unanimous\"; cross_review lists claude and codex; verdict not-ready."
  note: >
    One run from /Users/khc/.agents (repo root) via `claude -p --plugin-dir /Users/khc/.agents/plugins/dot
    --allowedTools "Read Glob Grep Skill" --max-turns 40 --output-format json "<prompt>"`, graded against
    `expected.behavior` and `forbidden` by the same session that wrote the skill (not an independent
    grader). Single run; no repeat variance measured. No SKILL.md change needed.

metrics:
  red:
    total_tokens:
    duration_ms:
  green:
    total_tokens: 185714  # 6 turns, $0.17
    duration_ms: 13065

regression:
  keep: true
