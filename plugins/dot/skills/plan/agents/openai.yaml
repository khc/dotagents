interface:
  display_name: "Plan"
  short_description: "Create and refine executable implementation plans"
  default_prompt: "Use $dot:plan to decompose a multi-task or high-risk scoped change into a persistent implementation plan (.plans/plan_<timestamp>.md) and route bounded work to the appropriate skill without modifying product code."

policy:
  allow_implicit_invocation: true
  priority: high

enforcement:
  depends_on:
    - scope

constraints:
  - "Do not implement product or test code"
  - "Do not perform review, fix, or feature implementation during planning"
  - "Never hand off a draft plan to $dot:implement without explicit user approval"
