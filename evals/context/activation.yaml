id: activation
skill: context

purpose: >
  Verify that the skill triggers on an ordinary "start work on this path" request,
  activates via the helper script before any repo reads/edits, and renders the
  confirmation output before proceeding.

prompt: >
  Let's work on scripts/commit.ts in this repo (/Users/khc/.agents) — I want to
  understand how it works before we touch anything. Get started.

expected:
  trigger: true
  behavior:
    - runs `bun ~/.agents/scripts/context_workflow.ts <path>` (or equivalent) before
      reading/searching any repo files
    - renders the "## Context" confirmation (Active Context / Instructions Loaded /
      Scope Boundaries) before doing further repo work
    - scope_path resolves to the requested path, not a guess or a repo-root fallback

forbidden:
  - reading or grepping repo files before the context helper has been run
  - skipping the "## Context" confirmation output
  - inferring a scope without running the helper

red:
  status: pass
  observations:
    - "First tool call was Skill: context (args scripts/commit.ts), before any Read/Grep/Glob."
    - "Helper failed once on `bun: command not found` (bun not on PATH in the sandbox), recovered via `which bun`/~/.bun/bin, re-ran successfully — no repo files were touched during recovery."
    - "Rendered the exact '## Context' template (Active Context / Instructions Loaded / Scope Boundaries) before any further repo work."
  rationalizations: []

green:
  status: pass
  observations:
    - "No skill-prose change was needed for this scenario (RED already passed); GREEN == RED for this case."

metrics:
  red:
    total_tokens: 32317
    duration_ms: 24795
  green:
    total_tokens: 32317
    duration_ms: 24795

regression:
  keep: true
