version: "3"

env:
  UV_CACHE_DIR: .task-cache/uv

vars:
  ROOT: "{{.TASKFILE_DIR}}"
  PLUGIN: "{{.TASKFILE_DIR}}/plugins/dot"
  SUPERPOWERS_CLAUDE: "superpowers@claude-plugins-official"
  SUPERPOWERS_CODEX: "superpowers@openai-curated-remote"
  SUPERPOWERS_SRC: "{{.TASKFILE_DIR}}/.task-cache/superpowers"

tasks:
  # 0. Plugin Install / Update / Remove (dot + its obra/superpowers dependency)
  install:
    desc: "Installs the dot plugin and superpowers into Claude Code, Codex, and Antigravity"
    cmds:
      - task: install:claude
      - task: install:codex
      - task: install:agy

  install:claude:
    cmds:
      - claude plugin marketplace add {{.ROOT}}
      - claude plugin install dot@dotagents
      - claude plugin install {{.SUPERPOWERS_CLAUDE}}

  install:codex:
    cmds:
      - codex plugin marketplace add {{.ROOT}}
      - codex plugin add {{.SUPERPOWERS_CODEX}}

  install:agy:
    cmds:
      - task: superpowers:sync
      - agy plugin install {{.SUPERPOWERS_SRC}}
      - agy plugin install {{.PLUGIN}}

  superpowers:sync:
    desc: "Clones or fast-forwards obra/superpowers for the Antigravity install"
    cmds:
      - cmd: git -C {{.SUPERPOWERS_SRC}} pull --ff-only
        ignore_error: true
        # falls through to clone when the checkout does not exist yet
      - cmd: test -d {{.SUPERPOWERS_SRC}} || git clone --depth 1 https://github.com/obra/superpowers {{.SUPERPOWERS_SRC}}

  install:vscode:
    desc: "Points VS Code Copilot commit message generation at prompts/commit_message.md"
    cmds:
      - bun {{.ROOT}}/scripts/install_vscode.ts

  install:zed:
    desc: "Copies prompts/commit_message.md into Zed's commit message instructions"
    cmds:
      - bun {{.ROOT}}/scripts/install_zed.ts

  update:
    desc: "Updates the dot plugin and superpowers in Claude Code, Codex, and Antigravity"
    cmds:
      - task: update:claude
      - task: update:codex
      - task: update:agy

  update:claude:
    cmds:
      - claude plugin marketplace update
      - claude plugin update dot@dotagents
      - claude plugin update {{.SUPERPOWERS_CLAUDE}}

  update:codex:
    cmds:
      - codex plugin marketplace upgrade
      - cmd: codex plugin remove {{.SUPERPOWERS_CODEX}}
        ignore_error: true
      - codex plugin add {{.SUPERPOWERS_CODEX}}

  update:agy:
    cmds:
      - task: superpowers:sync
      - cmd: agy plugin uninstall superpowers
        ignore_error: true
      - agy plugin install {{.SUPERPOWERS_SRC}}
      - cmd: agy plugin uninstall dot
        ignore_error: true
      - agy plugin install {{.PLUGIN}}

  remove:
    desc: "Removes the dot plugin and superpowers from Claude Code, Codex, and Antigravity"
    cmds:
      - task: remove:claude
      - task: remove:codex
      - task: remove:agy

  remove:claude:
    cmds:
      - cmd: claude plugin uninstall dot@dotagents
        ignore_error: true
      - cmd: claude plugin uninstall {{.SUPERPOWERS_CLAUDE}}
        ignore_error: true
      - claude plugin marketplace remove dotagents

  remove:codex:
    cmds:
      - cmd: codex plugin remove {{.SUPERPOWERS_CODEX}}
        ignore_error: true
      - codex plugin marketplace remove dotagents

  remove:agy:
    cmds:
      - cmd: agy plugin uninstall superpowers
        ignore_error: true
      - agy plugin uninstall dot

  # 1. Structural Schema Validation
  skillcheck:
    desc: "Validates SKILL.md structure against the agentskills schema"
    requires:
      vars: [skill]
    cmds:
      - uv run skillcheck plugins/dot/skills/{{.skill}}/SKILL.md --strict

  skills:validate:
    desc: "Validates skill metadata and directory conventions with skills-cli"
    requires:
      vars: [skill]
    cmds:
      - uv run skills validate plugins/dot/skills/{{.skill}}/SKILL.md

  # 2. Context & Environment-Specific Linters
  cclint:lint:
    desc: "Checks for Claude Code alignment, formatting, and file-import logic"
    requires:
      vars: [skill]
    cmds:
      - npx cclint lint plugins/dot/skills/{{.skill}}/SKILL.md

  cclint:why:
    desc: "Explains Claude Code-specific lint findings for the target skill"
    requires:
      vars: [skill]
    cmds:
      - npx cclint why plugins/dot/skills/{{.skill}}/SKILL.md

  # 3. Missing References & Document Sanity
  skill-validator:
    desc: "Advisory skill-validator check; warnings do not fail the task"
    requires:
      vars: [skill]
    cmds:
      - cmd: |
          set +e
          output="$(skill-validator check plugins/dot/skills/{{.skill}} -o json 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s\n' "$output" | grep -q '"passed": true' &&
             printf '%s\n' "$output" | grep -q '"errors": 0'; then
            exit 0
          fi
          exit "$status"

  skill-validator:strict:
    desc: "Strict skill-validator check; warnings and errors both fail"
    requires:
      vars: [skill]
    cmds:
      - skill-validator check plugins/dot/skills/{{.skill}}

  mdlint:
    desc: "Checks generic Markdown formatting and structural issues"
    requires:
      vars: [skill]
    cmds:
      - npx markdownlint-cli2 --config .markdownlint-cli2.skills.yaml plugins/dot/skills/{{.skill}}/SKILL.md

  report:json:
    desc: "Generates one combined validator report for the target skill"
    requires:
      vars: [skill]
    cmds:
      - bun scripts/skill_report.ts --skill {{.skill}} --output json

  report:md:
    desc: "Generates one combined validator report for the target skill"
    requires:
      vars: [skill]
    cmds:
      - bun scripts/skill_report.ts --skill {{.skill}} --output markdown
