interface:
  display_name: "Audit"
  short_description: "Verify recent changes without broad re-review"
  default_prompt: "Use $audit to verify a recent fix or feature by checking only the changed scope, confirming intended behavior, and reporting any direct regressions or validation gaps without expanding into a full review."

policy:
  allow_implicit_invocation: false
  priority: medium

enforcement:
  depends_on:
    - switch

constraints:
  - "Audit only the changed scope"
  - "Do not implement fixes unless explicitly asked"
  - "Do not perform a full review"
