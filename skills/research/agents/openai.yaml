interface:
  display_name: "Research"
  short_description: "Find the simplest, lowest-LOC implementation approach"
  default_prompt: "Use $research to determine the leanest implementation approach by evaluating standard library, existing project utilities, and minimal external libraries, then recommending a single best path without writing code."

policy:
  allow_implicit_invocation: false
  priority: high

constraints:
  - "Do not implement code"
  - "Recommend one final approach only"
  - "Prefer standard library or existing dependencies over new libraries"
