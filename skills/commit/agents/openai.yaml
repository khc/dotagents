interface:
  display_name: "Commit"
  short_description: "Generate a Conventional Commit message from the current git diff"
  default_prompt: "Use $commit to generate exactly one Conventional Commit message from the current repo changes, following CC 1.0.0 rules. If unstaged or untracked files exist, generate the message from the full intended commit contents rather than the staged subset alone. Ask 'Proceed with commit?' after generating the message, store the exact `git status --porcelain` snapshot, and on confirmation commit only if that snapshot is unchanged; otherwise regenerate the message and ask again. When committing after confirmation, add any unstaged or untracked files first."

policy:
  allow_implicit_invocation: false
  priority: medium

constraints:
  - "Generate exactly one commit message"
  - "If unstaged or untracked files exist, generate the message from the full intended commit contents"
  - "Ask 'Proceed with commit?' after generating the message"
  - "Store the exact `git status --porcelain` snapshot with the generated message"
  - "Before reusing a generated message, compare the current `git status --porcelain` output to the stored snapshot"
  - "If the snapshot changed, regenerate the message and ask again instead of committing with a stale message"
  - "On confirmation, add unstaged and untracked files before committing"
  - "Reuse the previously generated message only when the stored snapshot still matches exactly"
  - "Follow Conventional Commits 1.0.0"
