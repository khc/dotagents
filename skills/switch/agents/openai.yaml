interface:
  display_name: "Switch"
  short_description: "Scope work to a repo path and its AGENTS.md"
  default_prompt: "Before any repository work, you MUST run $switch to activate the correct path and apply AGENTS.md rules."

policy:
  allow_implicit_invocation: true
  priority: high

enforcement:
  required_before:
    - feature
    - fix
    - review
    - research
