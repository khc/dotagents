[project]
name = "agents"
version = "0.1.0"
description = "Agentic skill library for code review, fixes, feature implementation, research, and workspace management"
authors = [{name = "Karol Heczko", email = "karol.heczko@fifo.pl"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=2.41.1",
    "pyyaml>=6.0.3",
    "skillcheck>=1.3.0",
    "skills-cli>=0.2.0",
    "skills-ref>=0.1.1",
    "tyro>=1.0.13",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
extraPaths = ["src"]
typeCheckingMode = "recommended"
reportAny = "none"
reportExplicitAny = "none"
reportMissingTypeStubs = "none"
reportUnusedCallResult = "none"

[dependency-groups]
dev = [
    "basedpyright>=1.39.7",
    "deptry>=0.25.1",
    "ruff>=0.15.16",
]
